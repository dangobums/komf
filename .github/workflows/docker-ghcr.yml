name: Build and publish Docker image to GHCR

on:
  push:
    branches:
      - master
    tags:
      - "v*"
    paths:
      - ".github/workflows/docker-ghcr.yml"
      - "Dockerfile"
      - "**/*.kt"
      - "**/*.kts"
      - "gradle/**"
  # called by sync-upstream.yml (pushes made with GITHUB_TOKEN don't trigger push events)
  workflow_call:
    inputs:
      ref:
        description: Commit to build
        type: string
        required: true
  workflow_dispatch: {}

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    # job-level so it also applies when run via workflow_call
    concurrency:
      group: docker-ghcr
      cancel-in-progress: false

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build JAR with Gradle
        run: ./gradlew :komf-app:clean :komf-app:shadowJar

      # github.sha is the caller's commit under workflow_call, so read the checked-out one
      - name: Get commit sha
        id: sha
        run: echo "short=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/komf
          tags: |
            type=raw,value=latest
            type=raw,value=sha-${{ steps.sha.outputs.short }}
            type=semver,pattern={{version}}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
