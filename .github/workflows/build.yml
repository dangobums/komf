name: Build

on:
  push:
    branches-ignore:
      - master
    paths:
      - ".github/workflows/build.yml"
      - "**/*.kt"
      - "**/*.kts"
      - "gradle/**"
  pull_request:
    branches:
      - master
  workflow_dispatch: {}

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build JAR with Gradle
        run: ./gradlew :komf-app:shadowJar
